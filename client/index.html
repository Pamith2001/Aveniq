<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('aveniq_theme');
          var theme = (saved === 'dark') ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="icon" type="image/jpeg" href="/logo-dark.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aveniq | Next-Gen Software Engineering & Intelligent Systems</title>
    <meta name="description" content="Aveniq is a futuristic software engineering and AI startup delivering hyper-scalable cloud architectures, autonomous AI agents, and enterprise digital solutions." />
    <!-- Optimized Asynchronous Google Fonts with display=swap -->
    <!-- Modern Google Fonts: Plus Jakarta Sans (Primary Body & Subtitles), Outfit (Headings & Display), Space Grotesk (Tech Accent) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
